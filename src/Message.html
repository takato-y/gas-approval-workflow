<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <!--
    Message.html
    案内だけを表示する画面（期限切れ・処理済み・承認者でない等）。内部のエラーの詳細は出さない。
  -->
  <style>
    :root { --bg: #f5f7fa; --surface: #ffffff; --text: #1f2933; --border: #cbd2d9; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; line-height: 1.7; }
    * { box-sizing: border-box; }
    main { width: calc(100% - 32px); max-width: 680px; margin: 16px auto; padding: 24px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
  </style>
</head>
<body>
  <main>
    <h1><?= view.title ?></h1>
    <p><?= view.message ?></p>
  </main>
</body>
</html>
